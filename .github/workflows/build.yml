name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Determine version and release
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Latest build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CC: gcc
      CFLAGS: "-O2"
      LDFLAGS: "-static"
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build static ELF
        run: |
          make clean
          make
          mkdir -p dist
          cp sha2wordlist "dist/sha2wordlist-linux-${{ matrix.arch }}"
          file "dist/sha2wordlist-linux-${{ matrix.arch }}"

      - name: Test static ELF
        run: printf 'hello' | ./sha2wordlist -a sha512

      - name: Build .deb
        env:
          ARCH: ${{ matrix.deb_arch }}
        run: |
          make deb
          mv sha2wordlist.deb "dist/sha2wordlist_${VERSION}_${{ matrix.deb_arch }}.deb"
          dpkg-deb --info "dist/sha2wordlist_${VERSION}_${{ matrix.deb_arch }}.deb"

      - name: Build .rpm
        env:
          ARCH: ${{ matrix.rpm_arch }}
        run: |
          make rpm
          mv sha2wordlist-*.rpm dist/
          rpm -qip dist/sha2wordlist-*.rpm

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Linux -> macOS cross-compilation requires the Apple SDK. Build on a
      # macOS runner and cross-compile the other architecture with the SDK.
      - name: Build universal Darwin binary
        run: |
          make clean
          make CC=clang \
            CFLAGS="-O2 -arch arm64 -arch x86_64" \
            LDFLAGS="-arch arm64 -arch x86_64"
          mkdir -p dist
          cp sha2wordlist dist/sha2wordlist-darwin-universal
          lipo sha2wordlist -thin arm64 -output dist/sha2wordlist-darwin-arm64
          lipo sha2wordlist -thin x86_64 -output dist/sha2wordlist-darwin-x86_64
          file dist/*
          lipo -info dist/sha2wordlist-darwin-universal
          printf 'hello' | ./sha2wordlist -a sha512

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, linux, macos]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lh dist

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.name }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'false' }}
          generate_release_notes: ${{ needs.prepare.outputs.prerelease == 'false' }}
          files: dist/*
